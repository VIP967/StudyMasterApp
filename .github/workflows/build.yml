name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install -g cordova
          cordova create app com.yousef.studymaster "StudyMaster"
          cp index.html app/www/index.html
          cd app
          cordova platform add android
          cordova build android --no-telemetry
      - uses: actions/upload-artifact@v4
        with:
          name: StudyMaster-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
